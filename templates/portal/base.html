<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Cretan Staffing{% endblock %}</title><style>
:root{--navy:#10233f;--blue:#2357a6;--teal:#1f9d8b;--ink:#1c2b3e;--muted:#66758a;--bg:#f4f7fb;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}.nav{background:var(--navy);color:white;padding:18px max(24px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;font-size:20px;letter-spacing:-.4px}.brand span{color:#75d7c7}.nav a{color:white;text-decoration:none;margin-left:20px;font-size:14px}.wrap{max-width:1120px;margin:0 auto;padding:34px 24px}.hero{padding:40px 0 34px;display:grid;grid-template-columns:1.4fr .6fr;gap:28px;align-items:center}.eyebrow{color:var(--teal);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.08;letter-spacing:-2px;color:var(--navy);margin:12px 0 16px}.hero p{color:var(--muted);max-width:620px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 30px #10233f0a}.stat strong{display:block;font-size:42px;color:var(--blue)}.stat span{font-size:13px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:24px 0 18px}.sectionhead h2{margin:0;color:var(--navy);font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.job,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px #10233f08}.job h3{margin:10px 0 4px;font-size:19px;color:var(--navy)}.company{font-weight:650;font-size:14px}.meta{color:var(--muted);font-size:13px;margin:10px 0}.pill{display:inline-block;border-radius:20px;background:#e8f7f4;color:#187c70;font-size:11px;font-weight:800;padding:5px 10px}.btn{display:inline-block;background:var(--blue);color:white;text-decoration:none;border:0;border-radius:9px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}.btn:hover{background:#174583}.muted{color:var(--muted)}.form{display:grid;gap:14px}.form label{font-size:13px;font-weight:700}.form input,.form textarea{display:block;width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:9px;padding:12px;font:inherit;background:white}.form textarea{min-height:120px}.notice{background:#e8f7f4;border:1px solid #bce8df;color:#176b61;padding:12px 16px;border-radius:10px;margin:12px 0}.error{background:#fff1f2;color:#9f1239;padding:12px;border-radius:10px}.demo{background:#fff8e6;color:#8a5a00;border:1px solid #f5df9a;padding:10px 14px;border-radius:10px;font-size:12px;margin:18px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px}th{color:var(--muted);font-weight:700}.footer{margin-top:40px;background:#0b1930;color:#c4d0df;padding:24px;text-align:center;font-size:12px}@media(max-width:760px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.nav{padding:16px 20px}.nav a{margin-left:10px}.wrap{padding:24px 18px}}
</style></head><body><header class="nav"><div class="brand">CRETAN <span>STAFFING</span></div><div><a href="/">Find Jobs</a><a href="/admin/">Staff Login</a></div></header><main class="wrap">{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><footer class="footer">Cretan Staffing · Demo environment · Do not submit real personal information</footer></body></html>
